<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ETA Favicon">
  <defs>

    <linearGradient id="eta_fav_leftChev" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#00b4ff"/>
      <stop offset="50%" stop-color="#008cff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="eta_fav_leftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005ae6"/>
      <stop offset="100%" stop-color="#0038b3"/>
    </linearGradient>
    <linearGradient id="eta_fav_rightChev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b8ff"/>
      <stop offset="60%" stop-color="#0090ff"/>
      <stop offset="100%" stop-color="#006aff"/>
    </linearGradient>
    <linearGradient id="eta_fav_arrowShaftLeft" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#0080ff"/>
      <stop offset="60%" stop-color="#00c0ff"/>
      <stop offset="100%" stop-color="#38e2ff"/>
    </linearGradient>
    <linearGradient id="eta_fav_arrowShaftRight" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#0060e6"/>
      <stop offset="60%" stop-color="#008cff"/>
      <stop offset="100%" stop-color="#00b4ff"/>
    </linearGradient>
    <linearGradient id="eta_fav_arrowHeadLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#38e2ff"/>
    </linearGradient>
    <linearGradient id="eta_fav_arrowHeadRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0072f0"/>
      <stop offset="100%" stop-color="#00a0ff"/>
    </linearGradient>
    <linearGradient id="eta_fav_capRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0080ff"/>
      <stop offset="100%" stop-color="#0050d0"/>
    </linearGradient>
    <linearGradient id="eta_fav_tassel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00a0ff"/>
      <stop offset="100%" stop-color="#0070ea"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="#071324"/>
  <g transform="translate(-130, -1) scale(0.615)">

    <g id="eta_fav_symbol">
      <!-- Skullcap Base U-Band with glowing cyan rim -->
      <path d="M 409,490 L 411,630 C 411,675 515,692 627,692 C 739,692 838,675 838,630 L 838,492 L 786,522 L 786,597 C 786,622 715,636 627,636 C 539,636 460,622 460,597 L 460,522 Z" fill="url(#eta_fav_capRim)" stroke="#00d0ff" stroke-width="2" stroke-opacity="0.85"/>

      <!-- Tassel -->
      <rect x="892.5" y="448" width="8" height="78" fill="url(#eta_fav_tassel)"/>
      <circle cx="896.5" cy="534" r="18" fill="url(#eta_fav_tassel)"/>
      <path d="M 885,550 L 864,680 C 880,688 913,688 929,680 L 908,550 Z" fill="url(#eta_fav_tassel)"/>

      <!-- Right Chevron -->
      <polygon points="973,418 728,288 700,343 838,418 680,503 680,574" fill="url(#eta_fav_rightChev)"/>

      <!-- Orbital Swoosh Swirl behind arrow shaft -->
      <path d="M 540,518 C 620,490 730,440 762,350 C 772,320 758,295 726,290 C 700,286 670,305 640,330 C 670,314 695,304 712,308 C 730,312 738,328 728,354 C 698,420 598,474 540,518 Z" fill="#ffffff" fill-opacity="0.95"/>
      <path d="M 580,315 C 625,280 670,250 710,240 C 690,250 655,275 615,305 Z" fill="#b0eeff" fill-opacity="0.7"/>

      <!-- Sparkle Stars -->
      <path d="M 655,245 Q 655,265 640,265 Q 655,265 655,285 Q 655,265 670,265 Q 655,265 655,245 Z" fill="#ffffff"/>
      <path d="M 815,260 Q 815,275 802,275 Q 815,275 815,290 Q 815,275 828,275 Q 815,275 815,260 Z" fill="#5ce5ff"/>

      <!-- Arrow Shaft -->
      <polygon points="545,490 567,505 725,230 721,221" fill="url(#eta_fav_arrowShaftLeft)"/>
      <polygon points="567,505 566,577 729,241 725,230" fill="url(#eta_fav_arrowShaftRight)"/>

      <!-- Left Chevron Body -->
      <polygon points="586,249 281,419 566,577 567,505 410,418 588,322" fill="url(#eta_fav_leftChev)"/>
      <!-- Left Chevron Fold Facet -->
      <polygon points="510,472 566,577 567,505" fill="url(#eta_fav_leftFacet)"/>

      <!-- Arrowhead with circular aperture cutout -->
      <polygon points="783,147 663,212 721,221 725,230" fill="url(#eta_fav_arrowHeadLeft)"/>
      <polygon points="783,147 725,230 729,239 754,273" fill="url(#eta_fav_arrowHeadRight)"/>
      <circle cx="754.5" cy="212.5" r="11" fill="#071324"/>
    </g>
  </g>
</svg>
