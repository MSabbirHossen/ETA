<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="status" aria-label="Loading Exploratory Training Academy">
  <style>
    @keyframes etaBracketLeft {
      0% { opacity: 0; transform: translate(-30px, 0); }
      30%, 100% { opacity: 1; transform: translate(0, 0); }
    }
    @keyframes etaBracketRight {
      0% { opacity: 0; transform: translate(30px, 0); }
      30%, 100% { opacity: 1; transform: translate(0, 0); }
    }
    @keyframes etaArrowRise {
      0%, 25% { opacity: 0; transform: translate(-20px, 40px) scale(0.9); }
      55%, 100% { opacity: 1; transform: translate(0, 0) scale(1); }
    }
    @keyframes etaCapRim {
      0%, 50% { opacity: 0; transform: scale(0.95); }
      75%, 100% { opacity: 1; transform: scale(1); }
    }
    @keyframes etaPulseGlow {
      0%, 75% { opacity: 0.3; }
      85% { opacity: 0.9; }
      100% { opacity: 0.3; }
    }
    .eta-anim-left {
      animation: etaBracketLeft 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    .eta-anim-right {
      animation: etaBracketRight 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    .eta-anim-arrow {
      animation: etaArrowRise 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      transform-origin: 560px 520px;
    }
    .eta-anim-rim {
      animation: etaCapRim 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      transform-origin: 627px 630px;
    }
    .eta-anim-glow {
      animation: etaPulseGlow 2.4s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .eta-anim-left, .eta-anim-right, .eta-anim-arrow, .eta-anim-rim, .eta-anim-glow {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>

  <defs>
    <linearGradient id="ldr_leftChev" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#00b4ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="ldr_leftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005ae6"/>
      <stop offset="100%" stop-color="#0038b3"/>
    </linearGradient>
    <linearGradient id="ldr_rightChev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b8ff"/>
      <stop offset="100%" stop-color="#006aff"/>
    </linearGradient>
    <linearGradient id="ldr_arrowLeft" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#0080ff"/>
      <stop offset="100%" stop-color="#38e2ff"/>
    </linearGradient>
    <linearGradient id="ldr_arrowRight" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#0060e6"/>
      <stop offset="100%" stop-color="#00b4ff"/>
    </linearGradient>
    <linearGradient id="ldr_rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0080ff"/>
      <stop offset="100%" stop-color="#0050d0"/>
    </linearGradient>
  </defs>

  <g transform="translate(-142, -10) scale(0.635)">
    <!-- 3. Skullcap Base & Tassel -->
    <g class="eta-anim-rim">
      <path d="M 409,490 L 411,630 C 411,675 515,692 627,692 C 739,692 838,675 838,630 L 838,492 L 786,522 L 786,597 C 786,622 715,636 627,636 C 539,636 460,622 460,597 L 460,522 Z" fill="url(#ldr_rim)" stroke="#00d0ff" stroke-width="2"/>
      <rect x="892.5" y="448" width="8" height="78" fill="url(#ldr_rim)"/>
      <circle cx="896.5" cy="534" r="18" fill="url(#ldr_rim)"/>
      <path d="M 885,550 L 864,680 C 880,688 913,688 929,680 L 908,550 Z" fill="url(#ldr_rim)"/>
    </g>

    <!-- 1. Right Bracket -->
    <g class="eta-anim-right">
      <polygon points="973,418 728,288 700,343 838,418 680,503 680,574" fill="url(#ldr_rightChev)"/>
    </g>

    <!-- 2. Rising Center Arrow -->
    <g class="eta-anim-arrow">
      <polygon points="545,490 567,505 725,230 721,221" fill="url(#ldr_arrowLeft)"/>
      <polygon points="567,505 566,577 729,241 725,230" fill="url(#ldr_arrowRight)"/>
      <polygon points="783,147 663,212 721,221 725,230" fill="url(#ldr_arrowLeft)"/>
      <polygon points="783,147 725,230 729,239 754,273" fill="url(#ldr_arrowRight)"/>
      <circle cx="754.5" cy="212.5" r="11" fill="#071324"/>
    </g>

    <!-- 1. Left Bracket -->
    <g class="eta-anim-left">
      <polygon points="586,249 281,419 566,577 567,505 410,418 588,322" fill="url(#ldr_leftChev)"/>
      <polygon points="510,472 566,577 567,505" fill="url(#ldr_leftFacet)"/>
    </g>

    <!-- Settle glow & stars -->
    <g class="eta-anim-glow">
      <path d="M 655,245 Q 655,265 640,265 Q 655,265 655,285 Q 655,265 670,265 Q 655,265 655,245 Z" fill="#ffffff"/>
      <path d="M 815,260 Q 815,275 802,275 Q 815,275 815,290 Q 815,275 828,275 Q 815,275 815,260 Z" fill="#5ce5ff"/>
    </g>
  </g>
</svg>
