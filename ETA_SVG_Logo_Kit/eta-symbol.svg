      <circle cx="896.5" cy="534" r="18" fill="url(#eta_sym_light_tassel)"/>
      <path d="M 885,550 L 864,680 C 880,688 913,688 929,680 L 908,550 Z" fill="url(#eta_sym_light_tassel)"/>

