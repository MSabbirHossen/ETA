name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Type-check, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint workspace packages
        run: pnpm lint

      - name: Type-check TypeScript
        run: pnpm type-check

      - name: Run unit & integration tests
        run: pnpm test

      - name: Build applications & packages
        run: pnpm build
        env:
          # Build-time dummy validation values for environment schema
          MONGODB_URI: mongodb://localhost:27017/eta_ci
          FIREBASE_PROJECT_ID: ci-project
          FIREBASE_CLIENT_EMAIL: ci@ci.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nCI_KEY\n-----END PRIVATE KEY-----\n"
          FRONTEND_URL: https://eta-web-omega.vercel.app
          NEXT_PUBLIC_APP_URL: https://eta-web-omega.vercel.app
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
